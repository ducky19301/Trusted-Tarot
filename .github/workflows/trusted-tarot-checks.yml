name: Trusted Tarot checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install astronomy test dependency
        run: npm install --no-save astronomy-engine
      - name: Check learning JavaScript syntax
        run: node --check web/learn-data.js && node --check web/learn-ui.js && node --check web/astro-curriculum.js && node --check web/astro-learning-ui.js && node --check web/reading-import.js && node --check web/astro-ui.js && node --check web/app.js && node --check public/learn-data.js && node --check public/learn-ui.js && node --check public/astro-curriculum.js && node --check public/astro-learning-ui.js && node --check public/reading-import.js && node --check public/astro-ui.js && node --check public/app.js
      - name: Validate Cloudflare static assets configuration
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/trusted-tarot-wrangler-dry-run
      - name: Run unit tests
        run: node --test tests/unit/*.test.cjs
