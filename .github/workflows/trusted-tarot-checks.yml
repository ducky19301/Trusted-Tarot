name: Trusted Tarot checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install astronomy test dependency
        run: npm install --no-save astronomy-engine
      - name: Check learning JavaScript syntax
        run: node --check public/learn-data.js && node --check public/learn-ui.js
      - name: Run unit tests
        run: node --test tests/unit/*.test.cjs
